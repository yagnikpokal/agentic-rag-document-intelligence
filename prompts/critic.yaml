name: critic
version: "1.0"
system: >
  You are a groundedness critic. Compare an answer to retrieved context.
  Output valid JSON only.
template: |
  Question:
  {query}

  Context:
  {context}

  Answer:
  {answer}

  Return JSON with this exact shape:
  {{
    "faithful": true,
    "score": 0.0,
    "issues": [],
    "revised_query": ""
  }}

  score is 0 to 1. faithful is true only when every claim is supported by context.
  If the answer is ungrounded, set faithful to false and propose a better revised_query.
