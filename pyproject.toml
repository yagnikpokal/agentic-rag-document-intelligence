[project]
name = "docsearch"
version = "1.0.0"
description = "Agentic RAG document search platform with OpenWebUI, LlamaIndex, CrewAI, and Phoenix"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.18",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "pgvector>=0.3.6",
    "docling>=2.15.0",
    "llama-index>=0.12.0",
    "llama-index-core>=0.12.0",
    "llama-index-vector-stores-postgres>=0.4.0",
    "llama-index-llms-ollama>=0.5.0",
    "llama-index-embeddings-ollama>=0.5.0",
    "crewai>=0.80.0",
    "arize-phoenix>=8.0.0",
    "arize-phoenix-otel>=0.8.0",
    "openinference-instrumentation-llama-index>=3.0.0",
    "openinference-instrumentation-openai>=0.1.19",
    "openinference-instrumentation-crewai>=0.1.6",
    "ragas>=0.2.14",
    "datasets>=3.0.0",
    "openai>=1.54.0",
    "langchain-openai>=0.2.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
docsearch-api = "docsearch.main:run"
docsearch-ingest = "docsearch.cli:ingest_cli"
docsearch-eval = "docsearch.cli:eval_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.uv]
package = true
