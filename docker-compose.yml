services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docsearch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: docsearch
      POSTGRES_USER: docsearch
      POSTGRES_PASSWORD: docsearch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsearch -d docsearch"]
      interval: 5s
      timeout: 5s
      retries: 20

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: docsearch-phoenix
    restart: unless-stopped
    ports:
      - "6006:6006"
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenixdata:/data
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 30s
      timeout: 5s
      retries: 3

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: docsearch-openwebui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      WEBUI_NAME: Document Search
      OPENAI_API_BASE_URL: http://host.docker.internal:8000/v1
      OPENAI_API_KEY: docsearch-local
      ENABLE_OLLAMA_API: "false"
      DEFAULT_MODELS: docsearch-agentic
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - openwebuidata:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: docsearch-ollama
    restart: unless-stopped
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama

volumes:
  pgdata:
  phoenixdata:
  openwebuidata:
  ollamadata:
